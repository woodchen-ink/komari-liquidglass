    <title>Komari Monitor</title>

    <!--
      Pre-React 骨架样式: JS 加载/解析前直接看到与最终页面同形的玻璃骨架,
      React mount 后会替换 #root, 自动覆盖这层占位.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #0f1014;
      }
      #initial-skeleton {
        position: fixed;
        inset: 0;
        z-index: 1;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .pre-skel {
        position: relative;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        isolation: isolate;
      }
      .pre-skel::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.18) 50%,
          transparent 100%
        );
        transform: translateX(-100%);
        animation: pre-shimmer 1.4s ease-in-out infinite;
      }
      @keyframes pre-shimmer {
        100% {
          transform: translateX(100%);
        }
      }
      .pre-glass {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(12px) saturate(180%);
        -webkit-backdrop-filter: blur(12px) saturate(180%);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.16),
          0 6px 20px rgba(0, 0, 0, 0.22);
        border-radius: 12px;
        width: 100%;
      }
      .pre-row {
        display: grid;
        gap: 0.5rem;
      }
      /* React 接管后隐藏占位; #root 有内容时即移除 */
      #root:not(:empty) ~ #initial-skeleton {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 首屏骨架: 在 main.tsx 加载/执行前显示, React mount 后自动隐藏 -->
    <div id="initial-skeleton" aria-hidden="true">
      <div style="width: 100%; max-width: 64rem; padding: 0 1rem; display: flex; flex-direction: column; gap: 1rem;">
        <!-- nav -->
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 1rem; max-height: 4rem;">
          <div class="pre-skel" style="height: 1.75rem; width: 10rem;"></div>
          <div style="display: flex; gap: 0.5rem;">
            <div class="pre-skel" style="height: 2rem; width: 2rem; border-radius: 9999px;"></div>
            <div class="pre-skel" style="height: 2rem; width: 4rem; border-radius: 9999px;"></div>
          </div>
        </div>
        <!-- summary 5 列 -->
        <div class="pre-glass" style="padding: 1rem;">
          <div class="pre-row" style="grid-template-columns: repeat(5, 1fr);">
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
              <div class="pre-skel" style="height: 0.75rem; width: 5rem;"></div>
              <div class="pre-skel" style="height: 1.25rem; width: 7rem;"></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
              <div class="pre-skel" style="height: 0.75rem; width: 5rem;"></div>
              <div class="pre-skel" style="height: 1.25rem; width: 7rem;"></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
              <div class="pre-skel" style="height: 0.75rem; width: 5rem;"></div>
              <div class="pre-skel" style="height: 1.25rem; width: 7rem;"></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
              <div class="pre-skel" style="height: 0.75rem; width: 5rem;"></div>
              <div class="pre-skel" style="height: 1.25rem; width: 7rem;"></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
              <div class="pre-skel" style="height: 0.75rem; width: 5rem;"></div>
              <div class="pre-skel" style="height: 1.25rem; width: 7rem;"></div>
            </div>
          </div>
        </div>
        <!-- 节点骨架 x 3 -->
        <div class="pre-glass" style="padding: 1rem; height: 11rem;"></div>
        <div class="pre-glass" style="padding: 1rem; height: 11rem;"></div>
        <div class="pre-glass" style="padding: 1rem; height: 11rem;"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
